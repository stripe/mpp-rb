name: Conformance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: tempoxyz/mpp-tools/.github/workflows/sdk-conformance.yml@877e89a4076bfac890d518974b290fc13c58f49c # main
    with:
      adapter: ruby
      conformance-ref: c5dde8faa684b79e2df665143cf7cd731608c079
